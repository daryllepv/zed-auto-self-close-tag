[package]
name = "auto-self-close-tag-lsp"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-astro-next = "0.1.1"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-typescript = "0.23"
tree-sitter-vue-next = "0.1"
tree-sitter-xml = "0.7"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
thiserror = "2"

[[bench]]
name = "typing"
harness = false

[lints]
workspace = true
