[package]
name = "auto-self-close-tag"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"

[workspace]
members = ["server"]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
expect_used = "warn"
unwrap_used = "warn"

[lints]
workspace = true
